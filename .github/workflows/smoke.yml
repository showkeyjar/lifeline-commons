name: smoke

on:
  push:
  pull_request:

jobs:
  run-loop:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run Lifeline OS loop (auto-discover + conformance check)
        run: python lifeline-os/orchestrator.py

      - name: Run protocol conformance validator (contract.py)
        run: python lifeline-os/contract.py

      - name: Check i18n key completeness (zh -> en/es)
        run: python lifeline-os/i18n.py --check

      - name: Generate robot action plan + run reference executor (Stage 6)
        run: python lifeline-os/orchestrator.py --execute

      - name: Run top-level closed loop (profile -> strategy -> simulation -> freedom index)
        run: |
          python lifeline-os/lifeline.py
          python lifeline-os/lifeline.py --lang en
          python lifeline-os/lifeline.py --profile examples/profiles/urban_landless_unemployed.json
          python lifeline-os/lifeline.py --profile examples/profiles/urban_skilled_remote.json

      - name: Run unit tests (contract conformance + coverage sanity + integration + i18n)
        run: python -m unittest discover -s tests -t . -v

      - name: Sustainability guardrails (Stage 5 — anti-capture / license / fork resistance)
        run: python -m unittest tests.test_sustainability -v
